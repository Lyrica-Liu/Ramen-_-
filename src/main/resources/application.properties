spring.profiles.active=local
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=20000
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
server.port=8080

jwt.secret=${JWT_SECRET:VocabTrackerDefaultSecretKeyChangeInProductionMin32Chars!}
jwt.expiration=86400000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

spring.cache.type=caffeine
spring.cache.cache-names=dict-all,dict-simple
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=1d
